<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR・バーコードリーダー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>QR・バーコードリーダー</h1>
    <p class="subtitle">スマホのカメラでQRコード・バーコードを読み取ります</p>
  </header>

  <main>
    <div class="controls">
      <button id="startBtn">スキャン開始</button>
      <button id="stopBtn" disabled>停止</button>
    </div>

    <div id="reader"><video id="video" playsinline muted></video></div>

    <section class="result">
      <h2>読み取り結果</h2>
      <div id="resultText">まだ読み取っていません</div>
      <p id="redirectMsg">呼び出し元のアプリに戻ります...</p>
      <div id="confirmBox" hidden>
        <p id="confirmMsg"></p>
        <button id="sendBtn">送る</button>
        <button id="cancelBtn">送らない</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@2.1.0/dist/iife/reader/index.js"></script>
  <script src="script.js"></script>
</body>
</html>
